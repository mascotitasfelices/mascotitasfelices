<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Inventory</title>
  <style>
    :root {
      --primary-blue: #0088ff;
      --bg-color: #f7f9fc;
      --text-main: #2b313d;
      --text-muted: #838e9e;
      --border-color: #e4e8ee;
      --success-green: #28a745;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }

    .breadcrumb { font-size: 0.8em; color: var(--text-muted); margin-bottom: 4px; }
    .breadcrumb span { color: var(--primary-blue); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 1.6em; margin: 0; }

    /* Filtros */
    .filter-card {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85em; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    
    input[type="text"], select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95em;
      outline: none;
      box-sizing: border-box;
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.95em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Lista Acordeón */
    .product-list { display: flex; flex-direction: column; gap: 10px; }

    .product-item {
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .product-item.contabilizado {
      border-left: 5px solid var(--success-green);
      background-color: #f3fdf5;
    }

    .product-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
    }

    .toggle-icon {
      width: 28px;
      height: 28px;
      background: var(--primary-blue);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      margin-right: 12px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .toggle-icon.open { transform: rotate(180deg); }

    .header-info { display: flex; gap: 8px; font-size: 0.95em; }
    .header-info .lbl { font-weight: bold; }
    .header-info .val { color: var(--primary-blue); font-weight: 600; }

    .product-details {
      display: none;
      padding: 0 16px 16px 56px;
      border-top: 1px solid #f0f0f0;
      margin-top: 4px;
    }

    .product-details.active { display: block; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.9em;
    }

    .detail-label { color: var(--text-muted); font-weight: 600; }
    .detail-value { font-weight: 500; text-align: right; }

    /* Grupo de Entrada para Stock Físico con Botón */
    .stock-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .stock-input-group input { width: 80px; text-align: center; }

    .btn-save-stock {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85em;
      cursor: pointer;
    }

    .checkbox-action {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-weight: bold;
      color: var(--text-main);
    }

    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary-blue); }

    /* Modal Interactivo Centrado */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: popup 0.25s ease-out;
    }

    @keyframes popup {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 50px; height: 50px;
      background: #e6f3ff; color: var(--primary-blue);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5em; margin: 0 auto 12px auto;
    }

    .modal-title { font-weight: bold; font-size: 1.1em; margin-bottom: 8px; }
    .modal-body { color: var(--text-muted); font-size: 0.9em; margin-bottom: 20px; line-height: 1.4; }
    .modal-body b { color: var(--text-main); }

    .modal-actions { display: flex; gap: 10px; }
    
    .btn-modal {
      flex: 1; padding: 10px; border-radius: 8px;
      font-weight: bold; border: none; cursor: pointer;
    }
    
    .btn-confirm { background: var(--primary-blue); color: white; }
    .btn-cancel { background: #e4e8ee; color: var(--text-main); }
  </style>
</head>
<body>

  <div class="breadcrumb">Home > <span>Products</span></div>
  <div class="header">
    <h1>☰ Products</h1>
    <span style="font-size: 1.2em; color: var(--primary-blue);">🔍</span>
  </div>

  <!-- Filtros -->
  <div class="filter-card">
    <div class="form-group">
      <label>Buscar Producto o Código</label>
      <input type="text" id="txtBuscar" placeholder="Ej: CAPA ALGODON...">
    </div>
    
    <div class="form-group">
      <label>Categoría</label>
      <select id="selectCategoria">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <button class="btn-primary" onclick="aplicarFiltros()">CONFIRMAR FILTRO</button>
  </div>

  <!-- Lista -->
  <div class="product-list" id="listaProductos">
    Cargando inventario...
  </div>

  <!-- Modal Interactivo Personaizadado -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-icon">📦</div>
      <div class="modal-title" id="modalTitle">Confirmar Acción</div>
      <div class="modal-body" id="modalBody">Mensaje de confirmación</div>
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="cerrarModal(false)">Cancelar</button>
        <button class="btn-modal btn-confirm" onclick="cerrarModal(true)">Aceptar</button>
      </div>
    </div>
  </div>

  <script>
    // PEGA AQUÍ TU URL DE APPS SCRIPT
    const URL_API = "https://script.google.com/macros/s/AKfycbwehpyLrQPJvJZRoq6yciRxPnwFWRQWgvebdFXdzOj2NZiTOjEhJdkgLAkkHhB7mnMffQ/exec"; 
    
    let productosGlobales = [];
    let accionPendiente = null;

    async function cargarDatos() {
      try {
        const res = await fetch(URL_API);
        productosGlobales = await res.json();
        poblarCategorias(productosGlobales);
        renderizarLista(productosGlobales);
      } catch(e) {
        document.getElementById('listaProductos').innerText = "Error cargando datos.";
      }
    }

    function poblarCategorias(data) {
      const select = document.getElementById('selectCategoria');
      select.innerHTML = '<option value="">Todas las categorías</option>';
      const categorias = [...new Set(data.map(item => item.categoria).filter(Boolean))];
      categorias.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function renderizarLista(data) {
      const container = document.getElementById('listaProductos');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">No se encontraron productos</div>';
        return;
      }

      data.forEach(item => {
        const verificado = item.manojo === true || item.manojo === "TRUE";
        const div = document.createElement('div');
        div.className = `product-item ${verificado ? 'contabilizado' : ''}`;
        div.id = `item-${item.fila}`;

        div.innerHTML = `
          <div class="product-header" onclick="toggleAcordeon(${item.fila})">
            <div class="toggle-icon" id="icon-${item.fila}">▼</div>
            <div class="header-info">
              <span class="lbl">Name</span>
              <span class="val">${item.producto}</span>
            </div>
          </div>

          <div class="product-details" id="details-${item.fila}">
            <div class="detail-row">
              <span class="detail-label">Código:</span>
              <span class="detail-value">${item.codigo}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Categoría:</span>
              <span class="detail-value">${item.categoria}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Stock Sistema:</span>
              <span class="detail-value">${item.stockSistema}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Variación:</span>
              <span class="detail-value" id="var-${item.fila}" style="font-weight:bold; color:var(--primary-blue);">${item.variacion}</span>
            </div>

            <!-- Entrada de Stock con Botón Guardar -->
            <div class="stock-input-group">
              <span class="detail-label">Stock Físico:</span>
              <input type="number" id="input-stock-${item.fila}" value="${item.stockAlmacen !== '' ? item.stockAlmacen : ''}" placeholder="0">
              <button class="btn-save-stock" onclick="pedirConfirmacionStock(${item.fila}, '${item.producto}')">Guardar</button>
            </div>

            <div class="checkbox-action">
              <input type="checkbox" id="chk-${item.fila}" ${verificado ? 'checked' : ''} 
                onclick="pedirConfirmacionVerificacion(this, ${item.fila}, '${item.producto}')">
              <span>Manojo (Contabilizado)</span>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleAcordeon(fila) {
      const details = document.getElementById(`details-${fila}`);
      const icon = document.getElementById(`icon-${fila}`);
      details.classList.toggle('active');
      icon.classList.toggle('open');
    }

    function aplicarFiltros() {
      const texto = document.getElementById('txtBuscar').value.toLowerCase().trim();
      const categoria = document.getElementById('selectCategoria').value;

      const filtrados = productosGlobales.filter(item => {
        const coincideTexto = (item.producto && item.producto.toLowerCase().includes(texto)) || 
                              (item.codigo && String(item.codigo).toLowerCase().includes(texto));
        const coincideCategoria = categoria === "" || item.categoria === categoria;
        return coincideTexto && coincideCategoria;
      });

      renderizarLista(filtrados);
    }

    /* Lógica del Modal */
    function abrirModal(titulo, cuerpo, callback) {
      document.getElementById('modalTitle').innerText = titulo;
      document.getElementById('modalBody').innerHTML = cuerpo;
      document.getElementById('modalOverlay').classList.add('active');
      accionPendiente = callback;
    }

    function cerrarModal(confirmado) {
      document.getElementById('modalOverlay').classList.remove('active');
      if (accionPendiente) {
        accionPendiente(confirmado);
        accionPendiente = null;
      }
    }

    /* Handlers con Modal y Botón */
    function pedirConfirmacionStock(fila, nombre) {
      const cantidad = document.getElementById(`input-stock-${fila}`).value;
      if (cantidad === '') return;

      abrirModal(
        "Confirmar Ingreso",
        `¿Deseas ingresar <b>${cantidad}</b> unidades para el producto:<br>"<b>${nombre}</b>"?`,
        async (confirmado) => {
          if (confirmado) {
            const res = await fetch(URL_API, {
              method: 'POST',
              body: JSON.stringify({ accion: "ACTUALIZAR_STOCK", fila: fila, stockAlmacen: cantidad })
            });
            const data = await res.json();
            if (data.status === 'ok') {
              document.getElementById(`var-${fila}`).innerText = data.variacion;
            }
          }
        }
      );
    }

    function pedirConfirmacionVerificacion(checkbox, fila, nombre) {
      const checked = checkbox.checked;
      checkbox.checked = !checked; // revertir temporalmente mientras confirma

      const mensaje = checked 
        ? `¿Confirmas marcar como verificado el producto:<br>"<b>${nombre}</b>"?` 
        : `¿Deseas desmarcar el producto:<br>"<b>${nombre}</b>"?`;

      abrirModal(
        "Verificación de Producto",
        mensaje,
        async (confirmado) => {
          if (confirmado) {
            checkbox.checked = checked;
            const itemCard = document.getElementById(`item-${fila}`);
            if (checked) {
              itemCard.classList.add('contabilizado');
            } else {
              itemCard.classList.remove('contabilizado');
            }

            await fetch(URL_API, {
              method: 'POST',
              body: JSON.stringify({ accion: "VERIFICAR", fila: fila, manojo: checked })
            });
          }
        }
      );
    }

    cargarDatos();
  </script>
</body>
</html>

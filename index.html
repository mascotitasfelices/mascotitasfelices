<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Inventory</title>
  <style>
    :root {
      --primary-blue: #0088ff;
      --bg-color: #f7f9fc;
      --text-main: #2b313d;
      --text-muted: #838e9e;
      --border-color: #e4e8ee;
      --success-green: #28a745;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }

    /* Header Nav */
    .breadcrumb { font-size: 0.8em; color: var(--text-muted); margin-bottom: 4px; }
    .breadcrumb span { color: var(--primary-blue); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 1.6em; margin: 0; display: flex; align-items: center; gap: 10px; }

    /* Filtros estilo la imagen */
    .filter-card {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85em; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    
    input[type="text"], select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95em;
      outline: none;
      box-sizing: border-box;
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.95em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Lista e Ítems Acordeón */
    .product-list { display: flex; flex-direction: column; gap: 10px; }

    .product-item {
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .product-item.contabilizado {
      border-left: 5px solid var(--success-green);
      background-color: #f3fdf5;
    }

    .product-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
    }

    .toggle-icon {
      width: 28px;
      height: 28px;
      background: var(--primary-blue);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      margin-right: 12px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .toggle-icon.open { transform: rotate(180deg); }

    .header-info { display: flex; gap: 8px; font-size: 0.95em; }
    .header-info .lbl { font-weight: bold; }
    .header-info .val { color: var(--primary-blue); font-weight: 600; }

    /* Detalle Desplegable */
    .product-details {
      display: none;
      padding: 0 16px 16px 56px;
      border-top: 1px solid #f0f0f0;
      margin-top: 4px;
    }

    .product-details.active { display: block; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.9em;
    }

    .detail-label { color: var(--text-muted); font-weight: 600; }
    .detail-value { font-weight: 500; text-align: right; }

    /* Formulario dentro del item */
    .stock-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-action {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-weight: bold;
      color: var(--text-main);
    }

    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary-blue); }
  </style>
</head>
<body>

  <div class="breadcrumb">Home > <span>Products</span></div>
  <div class="header">
    <h1>☰ Products</h1>
    <span style="font-size: 1.2em; color: var(--primary-blue);">🔍</span>
  </div>

  <!-- Panel de Filtros -->
  <div class="filter-card">
    <div class="form-group">
      <label>Buscar Producto o Código</label>
      <input type="text" id="txtBuscar" placeholder="Ej: CAPA ALGODON...">
    </div>
    
    <div class="form-group">
      <label>Categoría</label>
      <select id="selectCategoria">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <button class="btn-primary" onclick="aplicarFiltros()">CONFIRMAR FILTRO</button>
  </div>

  <!-- Contenedor del Inventario -->
  <div class="product-list" id="listaProductos">
    Cargando inventario...
  </div>

  <script>
    // REEMPLAZA CON TU URL DE DESPLIEGUE DE APPS SCRIPT
    const URL_API = "https://script.google.com/macros/s/AKfycbwehpyLrQPJvJZRoq6yciRxPnwFWRQWgvebdFXdzOj2NZiTOjEhJdkgLAkkHhB7mnMffQ/exec"; 
    
    let productosGlobales = [];

    async function cargarDatos() {
      try {
        const res = await fetch(URL_API);
        productosGlobales = await res.json();
        poblarCategorias(productosGlobales);
        renderizarLista(productosGlobales);
      } catch(e) {
        document.getElementById('listaProductos').innerText = "Error cargando datos.";
      }
    }

    function poblarCategorias(data) {
      const select = document.getElementById('selectCategoria');
      select.innerHTML = '<option value="">Todas las categorías</option>';
      const categorias = [...new Set(data.map(item => item.categoria).filter(Boolean))];
      categorias.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function renderizarLista(data) {
      const container = document.getElementById('listaProductos');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">No se encontraron productos</div>';
        return;
      }

      data.forEach(item => {
        const verificado = item.manojo === true || item.manojo === "TRUE";
        const div = document.createElement('div');
        div.className = `product-item ${verificado ? 'contabilizado' : ''}`;
        div.id = `item-${item.fila}`;

        div.innerHTML = `
          <div class="product-header" onclick="toggleAcordeon(${item.fila})">
            <div class="toggle-icon" id="icon-${item.fila}">▼</div>
            <div class="header-info">
              <span class="lbl">Name</span>
              <span class="val">${item.producto}</span>
            </div>
          </div>

          <div class="product-details" id="details-${item.fila}">
            <div class="detail-row">
              <span class="detail-label">Código:</span>
              <span class="detail-value">${item.codigo}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Categoría:</span>
              <span class="detail-value">${item.categoria}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Stock Sistema:</span>
              <span class="detail-value">${item.stockSistema}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Variación:</span>
              <span class="detail-value" id="var-${item.fila}" style="font-weight:bold; color:var(--primary-blue);">${item.variacion}</span>
            </div>

            <!-- Formulario interactivo -->
            <div class="stock-input-container">
              <span class="detail-label">Stock Físico:</span>
              <input type="number" value="${item.stockAlmacen !== '' ? item.stockAlmacen : ''}" 
                placeholder="0" onchange="guardarStock(${item.fila}, this.value, '${item.producto}')">
            </div>

            <div class="checkbox-action">
              <input type="checkbox" ${verificado ? 'checked' : ''} 
                onchange="confirmarVerificacion(this, ${item.fila}, '${item.producto}')">
              <span>Manojo (Contabilizado)</span>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleAcordeon(fila) {
      const details = document.getElementById(`details-${fila}`);
      const icon = document.getElementById(`icon-${fila}`);
      details.classList.toggle('active');
      icon.classList.toggle('open');
    }

    function aplicarFiltros() {
      const texto = document.getElementById('txtBuscar').value.toLowerCase().trim();
      const categoria = document.getElementById('selectCategoria').value;

      const filtrados = productosGlobales.filter(item => {
        const coincideTexto = (item.producto && item.producto.toLowerCase().includes(texto)) || 
                              (item.codigo && String(item.codigo).toLowerCase().includes(texto));
        const coincideCategoria = categoria === "" || item.categoria === categoria;
        return coincideTexto && coincideCategoria;
      });

      renderizarLista(filtrados);
    }

    async function guardarStock(fila, cantidad, nombre) {
      if (cantidad === '') return;
      if (!confirm(`¿Confirmas ingresar ${cantidad} unidades para:\n"${nombre}"?`)) return;

      const res = await fetch(URL_API, {
        method: 'POST',
        body: JSON.stringify({ accion: "ACTUALIZAR_STOCK", fila: fila, stockAlmacen: cantidad })
      });
      const data = await res.json();
      if (data.status === 'ok') {
        document.getElementById(`var-${fila}`).innerText = data.variacion;
      }
    }

    async function confirmarVerificacion(checkbox, fila, nombre) {
      const checked = checkbox.checked;
      const mensaje = checked ? `¿Confirmas marcar como verificado:\n"${nombre}"?` : `¿Deseas desmarcar:\n"${nombre}"?`;

      if (!confirm(mensaje)) {
        checkbox.checked = !checked;
        return;
      }

      const itemCard = document.getElementById(`item-${fila}`);
      if (checked) {
        itemCard.classList.add('contabilizado');
      } else {
        itemCard.classList.remove('contabilizado');
      }

      await fetch(URL_API, {
        method: 'POST',
        body: JSON.stringify({ accion: "VERIFICAR", fila: fila, manojo: checked })
      });
    }

    // Inicializar
    cargarDatos();
  </script>
</body>
</html>
